- title:       Star Wars Death Star arc42 Documentation
  url:         https://github.com/juangcarmona/starwars-deathstar-arc42-documentation
  author:      Juan G. Carmona
  description: >-
    The battle station from Star Wars, documented as if it were a system under
    construction — an invented subject used to walk through the arc42 template
    end to end, not a system anyone operates.
  note: >-
    Read it for the shape of the template rather than for depth: roughly 5,000
    words across all twelve sections, largely bullet lists, and the subject
    matter means no section has to survive contact with a real constraint. What
    it does teach well is traceability. Section 9 records the single central
    reactor as a decision, states the single point of failure in the rationale,
    and hands it forward to section 11, where it reappears as risk R1 with a
    mitigation — the decision-to-risk chain that real documentation usually
    leaves for the reader to reconstruct. Every diagram is Mermaid inside the
    Markdown, so GitHub renders them in place and there is nothing to check out
    or build.
  kind:        Invented subject
  facets:      [Markdown, Mermaid diagrams]
  sections:    All 12
  licence:     CC BY-NC 4.0
  language:    English and Spanish
  year:        2024–2025
  added:       2026-08
  group:       start-here

- title:       Heldenhelfer
  url:         https://gitlab.opencode.de/wuerzburg/heldenhelfer/-/blob/main/architecture_doc/src/docs/arc42/Architecture_HELD_WUE.adoc
  author:      smart and public GmbH, for Smarte Region Würzburg
  description: >-
    A volunteering platform for the clubs and initiatives of Würzburg:
    a self-built portal for club records and membership, wired by Kafka
    events to a Nextcloud digital office and a Discourse forum, with
    Keycloak single sign-on across all three.
  note: >-
    "Heldenhelfer liefert Euch alle Werkzeuge für moderne und effiziente
    Vereinsarbeit." Mit Heldenhelfer bieten Stadt und Landkreis Würzburg eine
    Plattform, die ehrenamtlichen Strukturen wie Vereinen dabei hilft, sich
    intern besser zu organisieren, mit anderen zu vernetzen und sich
    öffentlich zu präsentieren. Für engagierte Bürger:innen dient sie als
    zentrale Anlaufstelle, um Termine, Kontakte und Aktionen von Vereinen und
    Initiativen zu entdecken.


    Development on this codebase stopped in August 2024 and the repository is
    archived; the live platform now runs at
    [heldenhelfer.wuerzburg.de](https://heldenhelfer.wuerzburg.de/info/).
  kind:        Production system
  facets:      [Public sector, AsciiDoc, Structurizr diagrams, 35 quality scenarios, 7 decision records]
  sections:    All 12
  licence:     MIT
  year:        2024
  added:       2026-08
  group:       real-systems

- title:       geOrchestra Gateway — Architecture Documentation
  url:         https://docs.georchestra.org/gateway/en/latest/arc42/
  author:      The geOrchestra project
  description: >-
    The authentication gateway of geOrchestra, an open-source spatial data
    infrastructure run largely by public bodies:
      A Spring Cloud Gateway
    specialisation that fronts every other service in the platform and handles
    login, authorisation and routing for all of them.
  note: >-
    The documentation lives in the gateway's own repository and is released
    with it, which is the first thing worth noticing: it is maintained as code,
    not as a deliverable. Every diagram is generated from a checked-in
    Structurizr model with a build script beside it, so the pictures cannot
    quietly drift away from the prose.
    The scope: One component of geOrchestra, not the platform, and the longest sections
    are quality requirements and risks.
  kind:        Production system
  facets:      [Gateway component only, C4 section structure, Markdown, Structurizr diagrams]
  sections:    All but 4 and 9
  licence:     GPL-3.0
  added:       2026-08
  group:       real-systems



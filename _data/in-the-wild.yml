# ============================================================================
# arc42 Documentation in the Wild — documentation we link to but do not host.
#
# Rendered by _pages/in-the-wild.md. THIS IS NOT A LIST OF EXAMPLES. Everything
# under _systems/ has been read end to end and carries its provenance;
# everything here has not. The page says so once, at the top, and the page is
# deliberately set as a bibliography rather than as tiles so that a reader can
# see the difference before reading the disclaimer.
#
# WHY THERE ARE NO tile fields HERE (domain, main_goal, decisions, scale):
# every one of those is an AUDIT OUTPUT — you can only fill them in after
# reading twelve sections. Leaving them out is the mechanism that stops this
# list drifting back into being a second tile grid. If you find yourself
# wanting to add one, that entry probably belongs in _systems/ instead.
#
# `kind`, `sections` and `facets` are the THREE exceptions, and the line they
# draw is the whole reason they are allowed to exist: they describe the
# DOCUMENT, never the system. "Markdown", "All 12", "Invented subject" are
# things you can settle in five minutes with the repository open, and they
# are precisely what a reader needs in order to decide whether to spend an hour
# on a link we have not vetted.
# "Event-driven", "handles 4M requests/day", "main goal" are things you can only
# settle by reading it all, which is what the tiles promise and this page must
# not. Same test, applied per chip: could a stranger check this without reading
# the documentation? If not, it is not a facet — put it in `note`, where it is
# visibly OUR opinion and dated.
#
# THERE IS EXACTLY ONE CHIP, and it is `kind`. Everything else that used to be a
# chip is now plain text, because eighteen identical pills across five entries
# were the most clickable-looking things on a page where only the title is a
# link, and they gave a reader no way to tell the one fact that decides whether
# to open a link (is this a real system or a teaching toy?) from the four that
# do not. One pill, always present, always from the same short list, is
# comparable straight down the page. A second one is not.
#
# COVERAGE IS NOT A CHIP EITHER, BUT IT IS NOT BURIED. "All 12 sections" used
# to be a chip, and it was the least useful chip on the page precisely because
# it was the most important fact: every entry answers it, so as a chip it was
# present on some and silently absent on others, and a reader could not compare
# it to the entry below. It is `sections` now, first row of the rail, on every
# entry — and since 2026-08-11 it is ALSO printed as plain text beside the kind,
# because the rail sits below 150 words of our opinion on a phone, i.e. after
# the decision it is supposed to inform. One short value, printed twice, in two
# forms with two jobs: compare it in the rail, read it before the title. Do not
# make either of them a second chip.
#
# FIELDS
#   title        required  Name of the documentation, as its authors write it.
#   url          required  Where it lives. Checked by `make check-external`.
#   author       required  Who wrote it.
#   description  required  ONE neutral sentence: what the system is. No praise.
#   note         required  MARKDOWN since 2026-08-15. OUR paragraph: what is
#                          worth looking at, or what is thin.
#
#                          THE LINK TEXT MUST NAME ITS DESTINATION. Every other
#                          link on this page prints its host, because these
#                          links open in the same tab and seeing where one goes
#                          is what stands in for the warning (WCAG 3.2.5, and
#                          the argument is in _includes/in-the-wild-entry.html).
#                          An inline link prints no host, so the sentence has to
#                          do it: "openCode, the German public sector Platform
#                          for Digital Sovereignty" is fine, "here" and "this
#                          page" are not.
#
#                          USE IT SPARINGLY. A note carrying four links has
#                          stopped being an opinion and become a set of
#                          directions; that is what `links:` below is for. The
#                          case it exists for is the aside a labelled row
#                          cannot make, such as openCode not being opencode.ai.
#
#                          Raw HTML passes through (`<small>` works). Nothing
#                          sanitises this field, so it is a maintainer-only
#                          file by definition. A BLANK LINE inside the folded
#                          `>-` block now makes a real second paragraph, and an
#                          over-indented line still folds badly, only now four
#                          extra spaces render as a monospace code block rather
#                          than as an odd line break.
#
#                          Written by us, not by the author — a
#                          contributor supplies title/url/author/description
#                          and we write this. Author-supplied notes turn into
#                          blurbs. Up to about 150 words. This used to say "two
#                          or three sentences" and every note in the file was
#                          three times that, which is the schema being wrong
#                          rather than the notes: the note is the only thing on
#                          this page nobody else could have written, and it is
#                          the last block in an entry, so a reader who does not
#                          want it has already had the title, the kind and the
#                          description. Past 150 words it is a review.
#   kind         required  What sort of documentation this is, and the ONE chip
#                          on the entry. A closed vocabulary, because a chip
#                          that reads differently on every entry cannot be
#                          compared down the page, which is the only job it has:
#
#                            Production system
#                            Invented subject
#                            Student coursework
#
#                          `make check` fails anything else. Widening the list
#                          is a real decision, not a typo fix: add the term to
#                          this list AND to scripts/check-wild-fields.sh in the
#                          same commit, and say in the pull request what it
#                          tells a reader that no existing term does.
#   sections     required  How much of the template the document actually
#                          fills, shown as the FIRST row of the rail because it
#                          is the question every visitor has. Keep the wording
#                          uniform or the column stops being scannable:
#                          "All 12", "1–8" (en dash), "3, 5 and 7", "All but 4
#                          and 9", "Varies by team". It is checkable in five
#                          minutes with the document open, so it is a fact and
#                          not an audit output — see the facet rule above.
#   added        required  YYYY-MM. Lets a reader discount an old note without
#                          us re-checking every entry.
#   group        required  Which run the entry belongs to — an `id` from
#                          _data/in-the-wild-runs.yml, which is also where the
#                          runs are ordered and described. An entry whose group
#                          matches no run renders unheaded at the foot of the
#                          page and fails `make check`.
#   facets       optional  Up to FIVE short checkable facts about the FORM of
#                          the document, set as one quiet line of plain text
#                          under the byline. Not chips: see the paragraph above.
#                          What it is written in and drawn with belongs here
#                          ("Markdown", "AsciiDoc", "Structurizr diagrams"), and
#                          so does a structural departure a reader meets on the
#                          first screen ("C4 section structure"). Its kind does
#                          NOT: that is `kind`, and repeating it here prints it
#                          twice. Neither does anything the note already argues
#                          at length, which is where most of these came from.
#                          Five is a hard ceiling: the template renders five and
#                          drops the rest, because past five this line is a
#                          specification sheet.
#                          THIS IS A YAML FLOW SEQUENCE, so every comma starts a
#                          new facet: [Sections 3, 5, 7] is three facets, two of
#                          them reading "5" and "7". Section coverage goes in
#                          `sections:` and never here. `make check` fails on
#                          both, because the template says nothing about either.
#   licence      optional  SPDX-ish short form ("CC BY-NC 4.0"). Second row of
#                          the rail, and never omitted from it: on this page the
#                          licence is usually the ANSWER to the question the
#                          page opens with — why we link it instead of hosting
#                          it. Omit the field when unstated rather than
#                          guessing, and the rail prints "not stated", which is
#                          itself worth writing out.
#   language     optional  Omit when it is English — the rail PRINTS "English"
#                          for an absent value, so omitting it is a statement
#                          and not a gap. Name every language when there is
#                          more than one; a second edition is a reason to click.
#   year         optional  When the documentation was written, if knowable.
#                          A range is fine when it was revised substantially.
#                          The only rail row that may be missing, which is why
#                          it is last: the three above it always render, so the
#                          column reads straight down.
#   links        optional  WHERE THE PROJECT LIVES (2026-08-15). Up to THREE
#                          label/url pairs, printed as a small labelled block at
#                          the foot of the entry, under the note's signature.
#                          The link text is the bare host, so the reader sees
#                          the destination before clicking it.
#
#                          links:
#                            - label: Project site
#                              url:   https://urbo.digital/
#
#                          THE LABELS ARE A CLOSED VOCABULARY, same argument as
#                          `kind`: the block is only worth having because
#                          "Source" on one entry can be compared to "Source" on
#                          the next, and "Repository" renders just as happily.
#
#                            Project site        the software's own home
#                            Source              the repository
#                            Developer           who builds and maintains it
#                            Documentation home  a published docs site, when the
#                                                title link goes into a repo
#
#                          NOT WHO PAID FOR IT, and not who commissioned it.
#                          Funders, ministries and programmes are provenance;
#                          they belong in `note` where they can be explained.
#                          The test is whether a reader would go there to use or
#                          read the software.
#
#                          SKIP A ROW THAT ONLY REPEATS THE TITLE LINK'S HOST.
#                          A `Source` row pointing at the repository the title
#                          link already points into prints the same host twice,
#                          three lines apart, and buys nothing.
#
#                          Three is a HARD ceiling and `make check` fails a
#                          fourth rather than dropping it. `facets` truncates in
#                          silence and that is a mistake this does not copy.
#                          Every row needs both a label and a url, checked, or
#                          the block renders a dangling label.
#
# ORDER IS EDITORIAL AND IT HAS TWO LEVELS. Which run an entry appears under
# comes from its `group`; the runs themselves are ordered and named in
# _data/in-the-wild-runs.yml. Within a run, entries render top to bottom
# exactly as they appear below. Nothing is sorted anywhere.
#
# It used to sort by title, which is the right default for a bibliography
# nobody curates and the wrong one here — alphabetical put a fictional teaching
# example and a decade-deep book case study side by side with nothing to tell a
# newcomer which to open first. It then ran as one unbroken easiest-first list,
# which was the right sequence and completely imperceptible: past a screenful,
# a careful order and a random one look identical. The runs are that same
# sequence, chunked so that it can be read.
#
# It is NOT a ranking, and nothing on this page is better than anything else on
# it — the note under each entry is the only quality signal, and it is dated
# and signed by being ours.
#
# The cost is that adding an entry is a decision rather than an alphabetical
# insert. Say in the pull request which run it belongs to and why.
#
# Example entry, for copying:
#
#   - title:       Fizzbuzz Enterprise Platform
#     url:         https://beispiel-firma.de/architektur/
#     author:      Marie Fischer
#     description: A logistics scheduling system for a mid-sized freight operator.
#     note:        Sections 1–6 only, but section 4 is unusually candid about
#                  the strategy that was abandoned.
#     kind:        Production system
#     facets:      [HTML, PlantUML]
#     sections:    1–6
#     licence:     CC BY-SA 4.0
#     language:    German
#     year:        2019
#     added:       2026-08
#     group:       real-systems
#     links:
#       - label:   Project site
#         url:     https://beispiel-firma.de/
#
# Entries are added by someone who has at least opened the thing. `make
# check-external` can verify that a URL resolves, not that the documentation
# behind it is what we claim.
# ============================================================================


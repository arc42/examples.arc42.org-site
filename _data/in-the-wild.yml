# ============================================================================
# arc42 Documentation in the Wild — documentation we link to but do not host.
#
# Rendered by _pages/in-the-wild.md. THIS IS NOT A LIST OF EXAMPLES. Everything
# under _systems/ has been read end to end and carries its provenance;
# everything here has not. The page says so once, at the top, and the page is
# deliberately set as a bibliography rather than as tiles so that a reader can
# see the difference before reading the disclaimer.
#
# WHY THERE ARE NO tile fields HERE (domain, main_goal, decisions, scale):
# every one of those is an AUDIT OUTPUT — you can only fill them in after
# reading twelve sections. Leaving them out is the mechanism that stops this
# list drifting back into being a second tile grid. If you find yourself
# wanting to add one, that entry probably belongs in _systems/ instead.
#
# `facets` and `sections` are the TWO exceptions, and the line they draw is the
# whole reason they are allowed to exist: they describe the DOCUMENT, never the
# system. "Markdown", "All 12", "Fictional" are things you can settle in five
# minutes with the repository open, and they are precisely what a reader needs
# in order to decide whether to spend an hour on a link we have not vetted.
# "Event-driven", "handles 4M requests/day", "main goal" are things you can only
# settle by reading it all, which is what the tiles promise and this page must
# not. Same test, applied per chip: could a stranger check this without reading
# the documentation? If not, it is not a facet — put it in `note`, where it is
# visibly OUR opinion and dated.
#
# COVERAGE IS NOT A CHIP. "All 12 sections" used to be one, and it was the least
# useful chip on the page precisely because it was the most important fact:
# every entry answers it, so as a chip it is present on some and silently absent
# on others, and a reader cannot compare it to the entry below. It is now
# `sections`, first row of the rail, on every entry. Do not put it back in the
# chip row.
#
# FIELDS
#   title        required  Name of the documentation, as its authors write it.
#   url          required  Where it lives. Checked by `make check-external`.
#   author       required  Who wrote it.
#   description  required  ONE neutral sentence: what the system is. No praise.
#   note         required  OUR paragraph: what is worth looking at, or what is
#                          thin. Written by us, not by the author — a
#                          contributor supplies title/url/author/description
#                          and we write this. Author-supplied notes turn into
#                          blurbs. Up to about 150 words. This used to say "two
#                          or three sentences" and every note in the file was
#                          three times that, which is the schema being wrong
#                          rather than the notes: the note is the only thing on
#                          this page nobody else could have written, and it is
#                          the last block in an entry, so a reader who does not
#                          want it has already had the title, the chips and the
#                          description. Past 150 words it is a review.
#   sections     required  How much of the template the document actually
#                          fills, shown as the FIRST row of the rail because it
#                          is the question every visitor has. Keep the wording
#                          uniform or the column stops being scannable:
#                          "All 12", "1–8" (en dash), "3, 5 and 7", "All but 4
#                          and 9", "Varies by team". It is checkable in five
#                          minutes with the document open, so it is a fact and
#                          not an audit output — see the facet rule above.
#   added        required  YYYY-MM. Lets a reader discount an old note without
#                          us re-checking every entry.
#   group        required  Which run the entry belongs to — an `id` from
#                          _data/in-the-wild-runs.yml, which is also where the
#                          runs are ordered and described. An entry whose group
#                          matches no run renders unheaded at the foot of the
#                          page and fails `make check`.
#   facets       optional  Up to FIVE short checkable facts about the document,
#                          shown as chips. Read the paragraph above before
#                          adding one. Order them the way a reader triages:
#                          what kind of thing it is, how complete it is, what
#                          form it is in. Five is a hard ceiling — the template
#                          truncates silently past it, because a sixth chip
#                          turns a triage aid into a specification sheet.
#   licence      optional  SPDX-ish short form ("CC BY-NC 4.0"). Shown in the
#                          facts line beside the host, because on this page the
#                          licence is usually the ANSWER to the question the
#                          page opens with — why we link it instead of hosting
#                          it. Omit when unstated rather than guessing; "no
#                          licence given" is itself worth writing out.
#   language     optional  Omit when it is English — the rail PRINTS "English"
#                          for an absent value, so omitting it is a statement
#                          and not a gap. Name every language when there is
#                          more than one; a second edition is a reason to click.
#   year         optional  When the documentation was written, if knowable.
#                          A range is fine when it was revised substantially.
#                          The only rail row that may be missing, which is why
#                          it is last: the three above it always render, so the
#                          column reads straight down.
#
# ORDER IS EDITORIAL AND IT HAS TWO LEVELS. Which run an entry appears under
# comes from its `group`; the runs themselves are ordered and named in
# _data/in-the-wild-runs.yml. Within a run, entries render top to bottom
# exactly as they appear below. Nothing is sorted anywhere.
#
# It used to sort by title, which is the right default for a bibliography
# nobody curates and the wrong one here — alphabetical put a fictional teaching
# example and a decade-deep book case study side by side with nothing to tell a
# newcomer which to open first. It then ran as one unbroken easiest-first list,
# which was the right sequence and completely imperceptible: past a screenful,
# a careful order and a random one look identical. The runs are that same
# sequence, chunked so that it can be read.
#
# It is NOT a ranking, and nothing on this page is better than anything else on
# it — the note under each entry is the only quality signal, and it is dated
# and signed by being ours.
#
# The cost is that adding an entry is a decision rather than an alphabetical
# insert. Say in the pull request which run it belongs to and why.
#
# Example entry, for copying:
#
#   - title:       Fizzbuzz Enterprise Platform
#     url:         https://beispiel-firma.de/architektur/
#     author:      Marie Fischer
#     description: A logistics scheduling system for a mid-sized freight operator.
#     note:        Sections 1–6 only, but section 4 is unusually candid about
#                  the strategy that was abandoned.
#     facets:      [HTML, PlantUML]
#     sections:    1–6
#     licence:     CC BY-SA 4.0
#     language:    German
#     year:        2019
#     added:       2026-08
#     group:       real-systems
#
# Entries are added by someone who has at least opened the thing. `make
# check-external` can verify that a URL resolves, not that the documentation
# behind it is what we claim.
# ============================================================================

- title:       Star Wars Death Star arc42 Documentation
  url:         https://github.com/juangcarmona/starwars-deathstar-arc42-documentation
  author:      Juan G. Carmona
  description: >-
    The battle station from Star Wars, documented as if it were a system under
    construction — an invented subject used to walk through the arc42 template
    end to end, not a system anyone operates.
  note: >-
    Read it for the shape of the template rather than for depth: roughly 5,000
    words across all twelve sections, largely bullet lists, and the subject
    matter means no section has to survive contact with a real constraint. What
    it does teach well is traceability. Section 9 records the single central
    reactor as a decision, states the single point of failure in the rationale,
    and hands it forward to section 11, where it reappears as risk R1 with a
    mitigation — the decision-to-risk chain that real documentation usually
    leaves for the reader to reconstruct. Every diagram is Mermaid inside the
    Markdown, so GitHub renders them in place and there is nothing to check out
    or build.
  facets:      [Fictional teaching example, Markdown, Mermaid diagrams]
  sections:    All 12
  licence:     CC BY-NC 4.0
  language:    English and Spanish
  year:        2024–2025
  added:       2026-08
  group:       start-here

- title:       geOrchestra Gateway — Architecture Documentation
  url:         https://docs.georchestra.org/gateway/en/latest/arc42/
  author:      The geOrchestra project
  description: >-
    The authentication gateway of geOrchestra, an open-source spatial data
    infrastructure run largely by public bodies — a Spring Cloud Gateway
    specialisation that fronts every other service in the platform and handles
    login, authorisation and routing for all of them.
  note: >-
    The documentation lives in the gateway's own repository and is released
    with it, which is the first thing worth noticing: it is maintained as code,
    not as a deliverable. Every diagram is generated from a checked-in
    Structurizr model with a build script beside it, so the pictures cannot
    quietly drift away from the prose. Read it also for what it changes: there
    is no solution strategy section and no architecture decisions section at
    all, and the building block view is replaced by C4's container and
    component views. Be clear about the scope before you start — this documents
    one component of geOrchestra, not the platform, and the longest sections by
    some way are quality requirements and risks.
  facets:      [Production system, Gateway component only, C4 section structure, Markdown, Structurizr diagrams]
  sections:    All but 4 and 9
  licence:     GPL-3.0
  added:       2026-08
  group:       real-systems

# After geOrchestra in the same run, and the thinner of the two on purpose: it
# reads as the counterpoint. geOrchestra shows the template carried by its
# prose, GA-Lotse shows it carried entirely by its decision records.
- title:       GA-Lotse
  url:         https://gitlab.opencode.de/ga-lotse/ga-lotse-documentation
  author:      The GA-Lotse project
  description: >-
    A case management platform for German public health authorities, developed
    with the Hessian health ministry and funded by the EU, built as a service
    mesh into which individual business modules plug.
  note: >-
    Come for the decision records, not for the narrative. Most of the section
    files run to a paragraph and a diagram, and the deployment view is one
    sentence over one picture. The seven architecture decisions are the
    opposite: each states the options that were weighed, the outcome, and the
    consequences it accepted, including the ones that cost something. Read the
    service mesh record first. It explains why the team built their own instead
    of taking Istio or Linkerd, then writes down plainly that the choice buys
    them more testing, more security review and more maintenance. Public bodies
    rarely publish that sentence about themselves, which is most of why this
    entry is here. It sits on openCode, the German public sector's own code
    platform, and has been quiet since May 2025.
  facets:      [Production system, Public sector, AsciiDoc, 7 decision records]
  sections:    All but 6, 10 and 11
  licence:     CC BY-SA 4.0
  year:        2024–2025
  added:       2026-08
  group:       real-systems

- title:       Software Architecture course, University of Oviedo
  url:         https://arquisoft.github.io/
  author:      Students of the Software Engineering degree, University of Oviedo
  description: >-
    Not one documentation but several hundred: every team on this course
    documents the web application it builds over the semester using arc42 and
    publishes it, roughly twenty-five new ones a year since 2018, in Spanish
    and English cohorts working to the same brief.
  note: >-
    Read this one as coursework and it will not disappoint you. It is written
    by undergraduates in the second semester of their third year, under
    deadline, about systems that live for one term — nothing here has been
    maintained, operated, or argued over by anyone who had to live with the
    consequences. What no other link on this page can offer is the sample size.
    Twenty-five teams document the same brief in the same template in the same
    semester, which turns the template itself into the subject: the sections
    everybody fills in usefully and the ones everybody pads are visible at a
    glance, and that is a genuinely useful thing to see before you write your
    own. Start from the course page, pick a year, then pick a team — the
    2025-26 cohort is `yovi`, and yovi_en3a is a representative one, arc42 8.2
    in AsciiDoc with a Testing section added as 12.
  facets:      [Student coursework, ~25 new documentations a year, AsciiDoc, Spanish and English cohorts]
  sections:    Varies by team
  language:    English and Spanish
  year:        2018–2026
  added:       2026-08
  group:       corpora

# The URL is the SITE ROOT, not the /dokchess/arc42/ path that arc42.org still
# links to: that path 301s to a broken `https://www.dokchess.de//`. Checked
# 2026-08.
- title:       DokChess
  url:         https://www.dokchess.de/
  author:      Stefan Zörner
  description: >-
    A chess engine in Java, written so that its architecture could be
    documented — the running case study from Zörner's book on architecture
    documentation, published in full as a browsable arc42 site.
  note: >-
    This is what a finished arc42 documentation looks like, and it is the
    reason to have a list like this at all: every one of the twelve sections is
    filled, and the substantial ones are broken into pages of their own rather
    than padded — the building block view alone runs to eight, down to move
    search and position evaluation. Section 4 is the one to read if you only
    read one, because it argues the playing strategy before it draws anything.
    The subject is small and invented for teaching, so do not come here for
    scale or for the mess of a real deployment; come for the depth and the
    finish.
  facets:      [Java, Book case study]
  sections:    All 12
  licence:     CC BY-NC-SA
  language:    German, with an English translation
  year:        2025
  added:       2026-08
  group:       deep

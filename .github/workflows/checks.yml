name: checks

# ADR-0003 (consistency without coupling) puts the mechanical brand floor in
# CI: the retired-hex deny-list, the Imprint Rule, and link checking. GitHub
# Pages builds and deploys this site on its own; this workflow only gates.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Brand deny-list and Imprint Rule
        run: sh scripts/check-brand.sh

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build
      - name: Validate internal links and HTML
        run: bundle exec htmlproofer ./_site --disable-external --allow-hash-href

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The rules live in the script, NOT here. They were inlined in this file
      # until 2026-08-16, which meant `make check` could not run them and a
      # local run could not catch what CI caught: `upcoming: true` was taught
      # to check-system-fields.sh and to both templates and missed the copy
      # here, and main went red. One implementation, two callers.
      - name: Every example is complete and self-contained
        run: sh scripts/check-structure.sh
